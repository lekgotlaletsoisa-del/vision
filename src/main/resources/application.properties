spring.application.name=vision
server.address=127.0.0.1
server.port=8090
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.servlet.multipart.file-size-threshold=10MB
# Image plus fourteen optional processing fields; keep a bounded parser budget.
server.tomcat.max-part-count=16
server.error.include-message=never
spring.thymeleaf.cache=true

vision.canny-low=50
vision.canny-high=150
vision.min-contour-area=100
vision.blur-kernel=5
vision.max-upload-bytes=10485760
vision.max-pixels=16000000
vision.max-contours=2000
vision.max-concurrent-processing=2
vision.preview-max-dimension=1600
vision.preview-jpeg-quality=88
