<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vision Lab</title>
  <meta name="theme-color" content="#087f69">
  <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg(v=1)}">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon-32x32.png(v=1)}">
  <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48 64x64 256x256" th:href="@{/favicon.ico(v=1)}">
  <link rel="apple-touch-icon" sizes="180x180" th:href="@{/apple-touch-icon.png(v=1)}">
  <link rel="stylesheet" th:href="@{/vendor/bootstrap-5.3.8.min.css}">
  <link rel="stylesheet" th:href="@{/css/vision.css(v=8)}">
  <script defer th:src="@{/js/session-store.js(v=1)}"></script>
  <script defer th:src="@{/js/server-results.js(v=2)}"></script>
  <script defer th:src="@{/js/vision.js(v=14)}"></script>
</head>
<body>
<header class="lab-header">
  <div class="container-fluid lab-width"><a class="brand" th:href="@{/}"><img class="brand-symbol" th:src="@{/favicon.svg(v=1)}" width="34" height="34" alt=""> Vision Lab</a></div>
</header>
<main class="container-fluid lab-width py-4">
  <h1 class="visually-hidden">Vision Lab edges and contours</h1>
  <section id="results" class="card preview-card simple-dashboard" aria-label="Photo with edges and contours" aria-busy="false">
    <form id="process-form" class="preview-toolbar" th:action="@{/api/vision/process}" method="post" enctype="multipart/form-data"
          th:attr="data-max-bytes=${limits.maxUploadBytes()},data-max-pixels=${limits.maxPixels()}">
      <button class="btn btn-primary camera-button" type="button" id="camera-button">Take photo</button>
      <fieldset class="overlay-controls">
        <legend class="visually-hidden">Show on photo</legend>
        <label><input class="form-check-input" type="checkbox" id="show-contours" checked><span class="legend-dot contours-dot" aria-hidden="true"></span>Contours</label>
        <label><input class="form-check-input" type="checkbox" id="show-edges" checked><span class="legend-dot edges-dot" aria-hidden="true"></span>Edges</label>
      </fieldset>
    </form>
    <div class="image-stage">
      <p class="image-placeholder" id="image-placeholder">Take a photo to begin.</p>
      <img id="preview-image" alt="Photograph" hidden>
      <svg id="geometry-overlay" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" hidden></svg>
    </div>
    <div id="status" role="status" aria-live="polite" class="status-message" hidden></div>
    <noscript><p class="status-message">Enable JavaScript to take a photo and show edges and contours.</p></noscript>
  </section>
</main>
<dialog class="camera-dialog" id="camera-dialog" aria-labelledby="camera-title">
  <div class="camera-dialog-header">
    <h2 id="camera-title">Take photo</h2>
    <button type="button" id="camera-close" class="camera-close" aria-label="Close camera">×</button>
  </div>
  <video id="camera-video" autoplay muted playsinline aria-label="Camera preview"></video>
  <p id="camera-status" class="camera-status" role="status" aria-live="polite">Opening camera…</p>
  <div class="camera-dialog-footer">
    <button type="button" id="camera-shutter" class="camera-shutter" aria-label="Capture and process photo" disabled><span aria-hidden="true"></span></button>
    <span>Capture &amp; process</span>
  </div>
</dialog>
</body>
</html>
